tags:
- name: '#X Amz Target=OvertureService.CreateLag'
paths:
  /#X-Amz-Target=OvertureService.CreateLag:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: CreateLag
      description: <p>Creates a link aggregation group (LAG) with the specified number of bundled physical dedicated connections between the customer network and a specific Direct Connect location. A LAG is a logical interface that uses the Link Aggregation Control Protocol (LACP) to aggregate multiple interfaces, enabling you to treat them as a single interface.</p> <p>All connections in a LAG must use the same bandwidth (either 1Gbps or 10Gbps) and must terminate at the same Direct Connect endpoint.</p> <p>You can have up to 10 dedicated connections per LAG. Regardless of this limit, if you request more connections for the LAG than Direct Connect can allocate on a single endpoint, no LAG is created.</p> <p>You can specify an existing physical dedicated connection or interconnect to include in the LAG (which counts towards the total number of connections). Doing so interrupts the current physical dedicated connection, and re-establishes them as a member of the LAG. The LAG will be created on the same Direct Connect endpoint to which the dedicated connection terminates. Any virtual interfaces associated with the dedicated connection are automatically disassociated and re-associated with the LAG. The connection ID does not change.</p> <p>If the Amazon Web Services account used to create a LAG is a registered Direct Connect Partner, the LAG is automatically enabled to host sub-connections. For a LAG owned by a partner, any associated virtual interfaces cannot be directly configured.</p>
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lag'
        '480':
          description: DuplicateTagKeysException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DuplicateTagKeysException'
        '481':
          description: TooManyTagsException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyTagsException'
        '482':
          description: DirectConnectServerException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectConnectServerException'
        '483':
          description: DirectConnectClientException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectConnectClientException'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLagRequest'
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - OvertureService.CreateLag
      tags:
      - '#X Amz Target=OvertureService.CreateLag'
components:
  schemas:
    Count:
      type: integer
    MacSecKey:
      type: object
      properties:
        secretARN:
          allOf:
          - $ref: '#/components/schemas/SecretARN'
          - description: The Amazon Resource Name (ARN) of the MAC Security (MACsec) secret key.
        ckn:
          allOf:
          - $ref: '#/components/schemas/Ckn'
          - description: The Connection Key Name (CKN) for the MAC Security secret key.
        state:
          allOf:
          - $ref: '#/components/schemas/State'
          - description: '<p>The state of the MAC Security (MACsec) secret key.</p> <p>The possible values are:</p> <ul> <li> <p> <code>associating</code>: The MAC Security (MACsec) secret key is being validated and not yet associated with the connection or LAG.</p> </li> <li> <p> <code>associated</code>: The MAC Security (MACsec) secret key is validated and associated with the connection or LAG.</p> </li> <li> <p> <code>disassociating</code>: The MAC Security (MACsec) secret key is being disassociated from the connection or LAG</p> </li> <li> <p> <code>disassociated</code>: The MAC Security (MACsec) secret key is no longer associated with the connection or LAG.</p> </li> </ul>'
        startOn:
          allOf:
          - $ref: '#/components/schemas/StartOnDate'
          - description: The date that the MAC Security (MACsec) secret key takes effect. The value is displayed in UTC format.
      description: Information about the MAC Security (MACsec) secret key.
    Ckn:
      type: string
    State:
      type: string
    ConnectionState:
      type: string
      enum:
      - ordering
      - requested
      - pending
      - available
      - down
      - deleting
      - deleted
      - rejected
      - unknown
    DuplicateTagKeysException: {}
    Tag:
      type: object
      required:
      - key
      properties:
        key:
          allOf:
          - $ref: '#/components/schemas/TagKey'
          - description: The key.
        value:
          allOf:
          - $ref: '#/components/schemas/TagValue'
          - description: The value.
      description: Information about a tag.
    Bandwidth:
      type: string
    DirectConnectServerException: {}
    TagList:
      type: array
      items:
        $ref: '#/components/schemas/Tag'
      minItems: 1
    HasLogicalRedundancy:
      type: string
      enum:
      - unknown
      - true
      - false
    LagId:
      type: string
    BooleanFlag:
      type: boolean
    VLAN:
      type: integer
    SecretARN:
      type: string
    JumboFrameCapable:
      type: boolean
    CreateLagRequest:
      type: object
      required:
      - numberOfConnections
      - location
      - connectionsBandwidth
      - lagName
      title: CreateLagRequest
      properties:
        numberOfConnections:
          allOf:
          - $ref: '#/components/schemas/Count'
          - description: The number of physical dedicated connections initially provisioned and bundled by the LAG.
        location:
          allOf:
          - $ref: '#/components/schemas/LocationCode'
          - description: The location for the LAG.
        connectionsBandwidth:
          allOf:
          - $ref: '#/components/schemas/Bandwidth'
          - description: 'The bandwidth of the individual physical dedicated connections bundled by the LAG. The possible values are 1Gbps and 10Gbps. '
        lagName:
          allOf:
          - $ref: '#/components/schemas/LagName'
          - description: The name of the LAG.
        connectionId:
          allOf:
          - $ref: '#/components/schemas/ConnectionId'
          - description: The ID of an existing dedicated connection to migrate to the LAG.
        tags:
          allOf:
          - $ref: '#/components/schemas/TagList'
          - description: The tags to associate with the LAG.
        childConnectionTags:
          allOf:
          - $ref: '#/components/schemas/TagList'
          - description: The tags to associate with the automtically created LAGs.
        providerName:
          allOf:
          - $ref: '#/components/schemas/ProviderName'
          - description: The name of the service provider associated with the LAG.
        requestMACSec:
          allOf:
          - $ref: '#/components/schemas/RequestMACSec'
          - description: <p>Indicates whether the connection will support MAC Security (MACsec).</p> <note> <p>All connections in the LAG must be capable of supporting MAC Security (MACsec). For information about MAC Security (MACsec) prerequisties, see <a href="https://docs.aws.amazon.com/directconnect/latest/UserGuide/direct-connect-mac-sec-getting-started.html#mac-sec-prerequisites">MACsec prerequisties</a> in the <i>Direct Connect User Guide</i>.</p> </note>
    RequestMACSec:
      type: boolean
    ConnectionName:
      type: string
    LoaIssueTime:
      type: string
      format: date-time
    TagKey:
      type: string
      pattern: ^([\p{L}\p{Z}\p{N}_.:/=+\-@]*)$
      minLength: 1
      maxLength: 128
    ConnectionId:
      type: string
    EncryptionMode:
      type: string
    LocationCode:
      type: string
    LagName:
      type: string
    ProviderName:
      type: string
    OwnerAccount:
      type: string
    PortEncryptionStatus:
      type: string
    PartnerName:
      type: string
    StartOnDate:
      type: string
    LagState:
      type: string
      enum:
      - requested
      - pending
      - available
      - down
      - deleting
      - deleted
      - unknown
    TooManyTagsException: {}
    Lag:
      type: object
      properties:
        connectionsBandwidth:
          allOf:
          - $ref: '#/components/schemas/Bandwidth'
          - description: 'The individual bandwidth of the physical connections bundled by the LAG. The possible values are 1Gbps and 10Gbps. '
        numberOfConnections:
          allOf:
          - $ref: '#/components/schemas/Count'
          - description: The number of physical dedicated connections bundled by the LAG, up to a maximum of 10.
        lagId:
          allOf:
          - $ref: '#/components/schemas/LagId'
          - description: The ID of the LAG.
        ownerAccount:
          allOf:
          - $ref: '#/components/schemas/OwnerAccount'
          - description: The ID of the Amazon Web Services account that owns the LAG.
        lagName:
          allOf:
          - $ref: '#/components/schemas/LagName'
          - description: The name of the LAG.
        lagState:
          allOf:
          - $ref: '#/components/schemas/LagState'
          - description: '<p>The state of the LAG. The following are the possible values:</p> <ul> <li> <p> <code>requested</code>: The initial state of a LAG. The LAG stays in the requested state until the Letter of Authorization (LOA) is available.</p> </li> <li> <p> <code>pending</code>: The LAG has been approved and is being initialized.</p> </li> <li> <p> <code>available</code>: The network link is established and the LAG is ready for use.</p> </li> <li> <p> <code>down</code>: The network link is down.</p> </li> <li> <p> <code>deleting</code>: The LAG is being deleted.</p> </li> <li> <p> <code>deleted</code>: The LAG is deleted.</p> </li> <li> <p> <code>unknown</code>: The state of the LAG is not available.</p> </li> </ul>'
        location:
          allOf:
          - $ref: '#/components/schemas/LocationCode'
          - description: The location of the LAG.
        region:
          allOf:
          - $ref: '#/components/schemas/Region'
          - description: The Amazon Web Services Region where the connection is located.
        minimumLinks:
          allOf:
          - $ref: '#/components/schemas/Count'
          - description: The minimum number of physical dedicated connections that must be operational for the LAG itself to be operational.
        awsDevice:
          allOf:
          - $ref: '#/components/schemas/AwsDevice'
          - description: The Direct Connect endpoint that hosts the LAG.
        awsDeviceV2:
          allOf:
          - $ref: '#/components/schemas/AwsDeviceV2'
          - description: The Direct Connect endpoint that hosts the LAG.
        awsLogicalDeviceId:
          allOf:
          - $ref: '#/components/schemas/AwsLogicalDeviceId'
          - description: The Direct Connect endpoint that terminates the logical connection. This device might be different than the device that terminates the physical connection.
        connections:
          allOf:
          - $ref: '#/components/schemas/ConnectionList'
          - description: The connections bundled by the LAG.
        allowsHostedConnections:
          allOf:
          - $ref: '#/components/schemas/BooleanFlag'
          - description: Indicates whether the LAG can host other connections.
        jumboFrameCapable:
          allOf:
          - $ref: '#/components/schemas/JumboFrameCapable'
          - description: Indicates whether jumbo frames (9001 MTU) are supported.
        hasLogicalRedundancy:
          allOf:
          - $ref: '#/components/schemas/HasLogicalRedundancy'
          - description: Indicates whether the LAG supports a secondary BGP peer in the same address family (IPv4/IPv6).
        tags:
          allOf:
          - $ref: '#/components/schemas/TagList'
          - description: The tags associated with the LAG.
        providerName:
          allOf:
          - $ref: '#/components/schemas/ProviderName'
          - description: The name of the service provider associated with the LAG.
        macSecCapable:
          allOf:
          - $ref: '#/components/schemas/MacSecCapable'
          - description: Indicates whether the LAG supports MAC Security (MACsec).
        encryptionMode:
          allOf:
          - $ref: '#/components/schemas/EncryptionMode'
          - description: <p>The LAG MAC Security (MACsec) encryption mode.</p> <p>The valid values are <code>no_encrypt</code>, <code>should_encrypt</code>, and <code>must_encrypt</code>.</p>
        macSecKeys:
          allOf:
          - $ref: '#/components/schemas/MacSecKeyList'
          - description: The MAC Security (MACsec) security keys associated with the LAG.
      description: Information about a link aggregation group (LAG).
    AwsLogicalDeviceId:
      type: string
    Region:
      type: string
    TagValue:
      type: string
      pattern: ^([\p{L}\p{Z}\p{N}_.:/=+\-@]*)$
      minLength: 0
      maxLength: 256
    AwsDeviceV2:
      type: string
    DirectConnectClientException: {}
    MacSecCapable:
      type: boolean
    Connection:
      type: object
      properties:
        ownerAccount:
          allOf:
          - $ref: '#/components/schemas/OwnerAccount'
          - description: The ID of the Amazon Web Services account that owns the connection.
        connectionId:
          allOf:
          - $ref: '#/components/schemas/ConnectionId'
          - description: The ID of the connection.
        connectionName:
          allOf:
          - $ref: '#/components/schemas/ConnectionName'
          - description: The name of the connection.
        connectionState:
          allOf:
          - $ref: '#/components/schemas/ConnectionState'
          - description: '<p>The state of the connection. The following are the possible values:</p> <ul> <li> <p> <code>ordering</code>: The initial state of a hosted connection provisioned on an interconnect. The connection stays in the ordering state until the owner of the hosted connection confirms or declines the connection order.</p> </li> <li> <p> <code>requested</code>: The initial state of a standard connection. The connection stays in the requested state until the Letter of Authorization (LOA) is sent to the customer.</p> </li> <li> <p> <code>pending</code>: The connection has been approved and is being initialized.</p> </li> <li> <p> <code>available</code>: The network link is up and the connection is ready for use.</p> </li> <li> <p> <code>down</code>: The network link is down.</p> </li> <li> <p> <code>deleting</code>: The connection is being deleted.</p> </li> <li> <p> <code>deleted</code>: The connection has been deleted.</p> </li> <li> <p> <code>rejected</code>: A hosted connection in the <code>ordering</code> state enters the <code>rejected</code> state if it is deleted by the customer.</p> </li> <li> <p> <code>unknown</code>: The state of the connection is not available.</p> </li> </ul>'
        region:
          allOf:
          - $ref: '#/components/schemas/Region'
          - description: The Amazon Web Services Region where the connection is located.
        location:
          allOf:
          - $ref: '#/components/schemas/LocationCode'
          - description: The location of the connection.
        bandwidth:
          allOf:
          - $ref: '#/components/schemas/Bandwidth'
          - description: The bandwidth of the connection.
        vlan:
          allOf:
          - $ref: '#/components/schemas/VLAN'
          - description: The ID of the VLAN.
        partnerName:
          allOf:
          - $ref: '#/components/schemas/PartnerName'
          - description: The name of the Direct Connect service provider associated with the connection.
        loaIssueTime:
          allOf:
          - $ref: '#/components/schemas/LoaIssueTime'
          - description: The time of the most recent call to <a>DescribeLoa</a> for this connection.
        lagId:
          allOf:
          - $ref: '#/components/schemas/LagId'
          - description: The ID of the LAG.
        awsDevice:
          allOf:
          - $ref: '#/components/schemas/AwsDevice'
          - description: The Direct Connect endpoint on which the physical connection terminates.
        jumboFrameCapable:
          allOf:
          - $ref: '#/components/schemas/JumboFrameCapable'
          - description: Indicates whether jumbo frames (9001 MTU) are supported.
        awsDeviceV2:
          allOf:
          - $ref: '#/components/schemas/AwsDeviceV2'
          - description: The Direct Connect endpoint that terminates the physical connection.
        awsLogicalDeviceId:
          allOf:
          - $ref: '#/components/schemas/AwsLogicalDeviceId'
          - description: The Direct Connect endpoint that terminates the logical connection. This device might be different than the device that terminates the physical connection.
        hasLogicalRedundancy:
          allOf:
          - $ref: '#/components/schemas/HasLogicalRedundancy'
          - description: Indicates whether the connection supports a secondary BGP peer in the same address family (IPv4/IPv6).
        tags:
          allOf:
          - $ref: '#/components/schemas/TagList'
          - description: The tags associated with the connection.
        providerName:
          allOf:
          - $ref: '#/components/schemas/ProviderName'
          - description: The name of the service provider associated with the connection.
        macSecCapable:
          allOf:
          - $ref: '#/components/schemas/MacSecCapable'
          - description: Indicates whether the connection supports MAC Security (MACsec).
        portEncryptionStatus:
          allOf:
          - $ref: '#/components/schemas/PortEncryptionStatus'
          - description: <p>The MAC Security (MACsec) port link status of the connection.</p> <p>The valid values are <code>Encryption Up</code>, which means that there is an active Connection Key Name, or <code>Encryption Down</code>.</p>
        encryptionMode:
          allOf:
          - $ref: '#/components/schemas/EncryptionMode'
          - description: <p>The MAC Security (MACsec) connection encryption mode.</p> <p>The valid values are <code>no_encrypt</code>, <code>should_encrypt</code>, and <code>must_encrypt</code>.</p>
        macSecKeys:
          allOf:
          - $ref: '#/components/schemas/MacSecKeyList'
          - description: The MAC Security (MACsec) security keys associated with the connection.
      description: Information about an Direct Connect connection.
    MacSecKeyList:
      type: array
      items:
        $ref: '#/components/schemas/MacSecKey'
    ConnectionList:
      type: array
      items:
        $ref: '#/components/schemas/Connection'
    AwsDevice:
      type: string
      deprecated: true
  parameters:
