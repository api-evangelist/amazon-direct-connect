security:
- hmac: []
tags:
- name: '#X Amz Target=OvertureService.DeleteDirectConnectGatewayAssociationProposal'
paths:
  /#X-Amz-Target=OvertureService.DeleteDirectConnectGatewayAssociationProposal:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: DeleteDirectConnectGatewayAssociationProposal
      description: Deletes the association proposal request between the specified Direct Connect gateway and virtual private gateway or transit gateway.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteDirectConnectGatewayAssociationProposalResult'
        '480':
          description: DirectConnectServerException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectConnectServerException'
        '481':
          description: DirectConnectClientException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectConnectClientException'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteDirectConnectGatewayAssociationProposalRequest'
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - OvertureService.DeleteDirectConnectGatewayAssociationProposal
      tags:
      - '#X Amz Target=OvertureService.DeleteDirectConnectGatewayAssociationProposal'
components:
  schemas:
    GatewayIdentifier:
      type: string
    DeleteDirectConnectGatewayAssociationProposalResult:
      type: object
      properties:
        directConnectGatewayAssociationProposal:
          allOf:
          - $ref: '#/components/schemas/DirectConnectGatewayAssociationProposal'
          - description: The ID of the associated gateway.
    DirectConnectGatewayAssociationProposalState:
      type: string
      enum:
      - requested
      - accepted
      - deleted
    DirectConnectClientException: {}
    RouteFilterPrefixList:
      type: array
      items:
        $ref: '#/components/schemas/RouteFilterPrefix'
    DirectConnectGatewayAssociationProposal:
      type: object
      properties:
        proposalId:
          allOf:
          - $ref: '#/components/schemas/DirectConnectGatewayAssociationProposalId'
          - description: The ID of the association proposal.
        directConnectGatewayId:
          allOf:
          - $ref: '#/components/schemas/DirectConnectGatewayId'
          - description: The ID of the Direct Connect gateway.
        directConnectGatewayOwnerAccount:
          allOf:
          - $ref: '#/components/schemas/OwnerAccount'
          - description: The ID of the Amazon Web Services account that owns the Direct Connect gateway.
        proposalState:
          allOf:
          - $ref: '#/components/schemas/DirectConnectGatewayAssociationProposalState'
          - description: '<p>The state of the proposal. The following are possible values:</p> <ul> <li> <p> <code>accepted</code>: The proposal has been accepted. The Direct Connect gateway association is available to use in this state.</p> </li> <li> <p> <code>deleted</code>: The proposal has been deleted by the owner that made the proposal. The Direct Connect gateway association cannot be used in this state.</p> </li> <li> <p> <code>requested</code>: The proposal has been requested. The Direct Connect gateway association cannot be used in this state.</p> </li> </ul>'
        associatedGateway:
          allOf:
          - $ref: '#/components/schemas/AssociatedGateway'
          - description: Information about the associated gateway.
        existingAllowedPrefixesToDirectConnectGateway:
          allOf:
          - $ref: '#/components/schemas/RouteFilterPrefixList'
          - description: The existing Amazon VPC prefixes advertised to the Direct Connect gateway.
        requestedAllowedPrefixesToDirectConnectGateway:
          allOf:
          - $ref: '#/components/schemas/RouteFilterPrefixList'
          - description: The Amazon VPC prefixes to advertise to the Direct Connect gateway.
      description: 'Information about the proposal request to attach a virtual private gateway to a Direct Connect gateway. '
    DirectConnectGatewayAssociationProposalId:
      type: string
    DirectConnectServerException: {}
    CIDR:
      type: string
    GatewayType:
      type: string
      enum:
      - virtualPrivateGateway
      - transitGateway
    DirectConnectGatewayId:
      type: string
    RouteFilterPrefix:
      type: object
      properties:
        cidr:
          allOf:
          - $ref: '#/components/schemas/CIDR'
          - description: The CIDR block for the advertised route. Separate multiple routes using commas. An IPv6 CIDR must use /64 or shorter.
      description: Information about a route filter prefix that a customer can advertise through Border Gateway Protocol (BGP) over a public virtual interface.
    Region:
      type: string
    DeleteDirectConnectGatewayAssociationProposalRequest:
      type: object
      required:
      - proposalId
      title: DeleteDirectConnectGatewayAssociationProposalRequest
      properties:
        proposalId:
          allOf:
          - $ref: '#/components/schemas/DirectConnectGatewayAssociationProposalId'
          - description: The ID of the proposal.
    OwnerAccount:
      type: string
    AssociatedGateway:
      type: object
      properties:
        id:
          allOf:
          - $ref: '#/components/schemas/GatewayIdentifier'
          - description: The ID of the associated gateway.
        type:
          allOf:
          - $ref: '#/components/schemas/GatewayType'
          - description: The type of associated gateway.
        ownerAccount:
          allOf:
          - $ref: '#/components/schemas/OwnerAccount'
          - description: The ID of the Amazon Web Services account that owns the associated virtual private gateway or transit gateway.
        region:
          allOf:
          - $ref: '#/components/schemas/Region'
          - description: The Region where the associated gateway is located.
      description: Information about the associated gateway.
  parameters:
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
