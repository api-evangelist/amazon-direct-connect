paths:
  /#X-Amz-Target=OvertureService.CreateInterconnect:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: CreateInterconnect
      description: <p>Creates an interconnect between an Direct Connect Partner's network and a specific Direct Connect location.</p> <p>An interconnect is a connection that is capable of hosting other connections. The Direct Connect Partner can use an interconnect to provide Direct Connect hosted connections to customers through their own network services. Like a standard connection, an interconnect links the partner's network to an Direct Connect location over a standard Ethernet fiber-optic cable. One end is connected to the partner's router, the other to an Direct Connect router.</p> <p>You can automatically add the new interconnect to a link aggregation group (LAG) by specifying a LAG ID in the request. This ensures that the new interconnect is allocated on the same Direct Connect endpoint that hosts the specified LAG. If there are no available ports on the endpoint, the request fails and no interconnect is created.</p> <p>For each end customer, the Direct Connect Partner provisions a connection on their interconnect by calling <a>AllocateHostedConnection</a>. The end customer can then connect to Amazon Web Services resources by creating a virtual interface on their connection, using the VLAN assigned to them by the Direct Connect Partner.</p> <note> <p>Intended for use by Direct Connect Partners only.</p> </note>
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Interconnect'
        '480':
          description: DuplicateTagKeysException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DuplicateTagKeysException'
        '481':
          description: TooManyTagsException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyTagsException'
        '482':
          description: DirectConnectServerException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectConnectServerException'
        '483':
          description: DirectConnectClientException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectConnectClientException'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInterconnectRequest'
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - OvertureService.CreateInterconnect
      tags:
      - '#X Amz Target=OvertureService.CreateInterconnect'
components:
  schemas:
    DuplicateTagKeysException: {}
    Tag:
      type: object
      required:
      - key
      properties:
        key:
          allOf:
          - $ref: '#/components/schemas/TagKey'
          - description: The key.
        value:
          allOf:
          - $ref: '#/components/schemas/TagValue'
          - description: The value.
      description: Information about a tag.
    Bandwidth:
      type: string
    DirectConnectServerException: {}
    TagList:
      type: array
      items:
        $ref: '#/components/schemas/Tag'
      minItems: 1
    HasLogicalRedundancy:
      type: string
      enum:
      - unknown
      - true
      - false
    LagId:
      type: string
    JumboFrameCapable:
      type: boolean
    AwsDevice:
      type: string
      deprecated: true
    LoaIssueTime:
      type: string
      format: date-time
    TagKey:
      type: string
      pattern: ^([\p{L}\p{Z}\p{N}_.:/=+\-@]*)$
      minLength: 1
      maxLength: 128
    LocationCode:
      type: string
    CreateInterconnectRequest:
      type: object
      required:
      - interconnectName
      - bandwidth
      - location
      title: CreateInterconnectRequest
      properties:
        interconnectName:
          allOf:
          - $ref: '#/components/schemas/InterconnectName'
          - description: The name of the interconnect.
        bandwidth:
          allOf:
          - $ref: '#/components/schemas/Bandwidth'
          - description: The port bandwidth, in Gbps. The possible values are 1 and 10.
        location:
          allOf:
          - $ref: '#/components/schemas/LocationCode'
          - description: The location of the interconnect.
        lagId:
          allOf:
          - $ref: '#/components/schemas/LagId'
          - description: The ID of the LAG.
        tags:
          allOf:
          - $ref: '#/components/schemas/TagList'
          - description: The tags to associate with the interconnect.
        providerName:
          allOf:
          - $ref: '#/components/schemas/ProviderName'
          - description: The name of the service provider associated with the interconnect.
    ProviderName:
      type: string
    InterconnectState:
      type: string
      enum:
      - requested
      - pending
      - available
      - down
      - deleting
      - deleted
      - unknown
    TooManyTagsException: {}
    AwsLogicalDeviceId:
      type: string
    Region:
      type: string
    TagValue:
      type: string
      pattern: ^([\p{L}\p{Z}\p{N}_.:/=+\-@]*)$
      minLength: 0
      maxLength: 256
    InterconnectId:
      type: string
    DirectConnectClientException: {}
    InterconnectName:
      type: string
    Interconnect:
      type: object
      properties:
        interconnectId:
          allOf:
          - $ref: '#/components/schemas/InterconnectId'
          - description: The ID of the interconnect.
        interconnectName:
          allOf:
          - $ref: '#/components/schemas/InterconnectName'
          - description: The name of the interconnect.
        interconnectState:
          allOf:
          - $ref: '#/components/schemas/InterconnectState'
          - description: '<p>The state of the interconnect. The following are the possible values:</p> <ul> <li> <p> <code>requested</code>: The initial state of an interconnect. The interconnect stays in the requested state until the Letter of Authorization (LOA) is sent to the customer.</p> </li> <li> <p> <code>pending</code>: The interconnect is approved, and is being initialized.</p> </li> <li> <p> <code>available</code>: The network link is up, and the interconnect is ready for use.</p> </li> <li> <p> <code>down</code>: The network link is down.</p> </li> <li> <p> <code>deleting</code>: The interconnect is being deleted.</p> </li> <li> <p> <code>deleted</code>: The interconnect is deleted.</p> </li> <li> <p> <code>unknown</code>: The state of the interconnect is not available.</p> </li> </ul>'
        region:
          allOf:
          - $ref: '#/components/schemas/Region'
          - description: The Amazon Web Services Region where the connection is located.
        location:
          allOf:
          - $ref: '#/components/schemas/LocationCode'
          - description: The location of the connection.
        bandwidth:
          allOf:
          - $ref: '#/components/schemas/Bandwidth'
          - description: The bandwidth of the connection.
        loaIssueTime:
          allOf:
          - $ref: '#/components/schemas/LoaIssueTime'
          - description: The time of the most recent call to <a>DescribeLoa</a> for this connection.
        lagId:
          allOf:
          - $ref: '#/components/schemas/LagId'
          - description: The ID of the LAG.
        awsDevice:
          allOf:
          - $ref: '#/components/schemas/AwsDevice'
          - description: The Direct Connect endpoint on which the physical connection terminates.
        jumboFrameCapable:
          allOf:
          - $ref: '#/components/schemas/JumboFrameCapable'
          - description: Indicates whether jumbo frames (9001 MTU) are supported.
        awsDeviceV2:
          allOf:
          - $ref: '#/components/schemas/AwsDeviceV2'
          - description: The Direct Connect endpoint that terminates the physical connection.
        awsLogicalDeviceId:
          allOf:
          - $ref: '#/components/schemas/AwsLogicalDeviceId'
          - description: The Direct Connect endpoint that terminates the logical connection. This device might be different than the device that terminates the physical connection.
        hasLogicalRedundancy:
          allOf:
          - $ref: '#/components/schemas/HasLogicalRedundancy'
          - description: Indicates whether the interconnect supports a secondary BGP in the same address family (IPv4/IPv6).
        tags:
          allOf:
          - $ref: '#/components/schemas/TagList'
          - description: The tags associated with the interconnect.
        providerName:
          allOf:
          - $ref: '#/components/schemas/ProviderName'
          - description: The name of the service provider associated with the interconnect.
      description: Information about an interconnect.
    AwsDeviceV2:
      type: string
  parameters:
    X-Amz-SignedHeaders:
