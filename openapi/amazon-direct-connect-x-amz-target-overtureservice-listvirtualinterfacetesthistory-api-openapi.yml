security:
- hmac: []
tags:
- name: '#X Amz Target=OvertureService.ListVirtualInterfaceTestHistory'
paths:
  /#X-Amz-Target=OvertureService.ListVirtualInterfaceTestHistory:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: ListVirtualInterfaceTestHistory
      description: Lists the virtual interface failover test history.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListVirtualInterfaceTestHistoryResponse'
        '480':
          description: DirectConnectServerException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectConnectServerException'
        '481':
          description: DirectConnectClientException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectConnectClientException'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListVirtualInterfaceTestHistoryRequest'
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - OvertureService.ListVirtualInterfaceTestHistory
      tags:
      - '#X Amz Target=OvertureService.ListVirtualInterfaceTestHistory'
components:
  schemas:
    ListVirtualInterfaceTestHistoryRequest:
      type: object
      title: ListVirtualInterfaceTestHistoryRequest
      properties:
        testId:
          allOf:
          - $ref: '#/components/schemas/TestId'
          - description: The ID of the virtual interface failover test.
        virtualInterfaceId:
          allOf:
          - $ref: '#/components/schemas/VirtualInterfaceId'
          - description: The ID of the virtual interface that was tested.
        bgpPeers:
          allOf:
          - $ref: '#/components/schemas/BGPPeerIdList'
          - description: The BGP peers that were placed in the DOWN state during the virtual interface failover test.
        status:
          allOf:
          - $ref: '#/components/schemas/FailureTestHistoryStatus'
          - description: The status of the virtual interface failover test.
        maxResults:
          allOf:
          - $ref: '#/components/schemas/MaxResultSetSize'
          - description: <p>The maximum number of results to return with a single call. To retrieve the remaining results, make another call with the returned <code>nextToken</code> value.</p> <p>If <code>MaxResults</code> is given a value larger than 100, only 100 results are returned.</p>
        nextToken:
          allOf:
          - $ref: '#/components/schemas/PaginationToken'
          - description: The token for the next page of results.
    DirectConnectServerException: {}
    VirtualInterfaceTestHistory:
      type: object
      properties:
        testId:
          allOf:
          - $ref: '#/components/schemas/TestId'
          - description: The ID of the virtual interface failover test.
        virtualInterfaceId:
          allOf:
          - $ref: '#/components/schemas/VirtualInterfaceId'
          - description: The ID of the tested virtual interface.
        bgpPeers:
          allOf:
          - $ref: '#/components/schemas/BGPPeerIdList'
          - description: The BGP peers that were put in the DOWN state as part of the virtual interface failover test.
        status:
          allOf:
          - $ref: '#/components/schemas/FailureTestHistoryStatus'
          - description: The status of the virtual interface failover test.
        ownerAccount:
          allOf:
          - $ref: '#/components/schemas/OwnerAccount'
          - description: The owner ID of the tested virtual interface.
        testDurationInMinutes:
          allOf:
          - $ref: '#/components/schemas/TestDuration'
          - description: The time that the virtual interface failover test ran in minutes.
        startTime:
          allOf:
          - $ref: '#/components/schemas/StartTime'
          - description: The time that the virtual interface moves to the DOWN state.
        endTime:
          allOf:
          - $ref: '#/components/schemas/EndTime'
          - description: The time that the virtual interface moves out of the DOWN state.
      description: Information about the virtual interface failover test.
    PaginationToken:
      type: string
    BGPPeerId:
      type: string
    VirtualInterfaceId:
      type: string
    EndTime:
      type: string
      format: date-time
    FailureTestHistoryStatus:
      type: string
    VirtualInterfaceTestHistoryList:
      type: array
      items:
        $ref: '#/components/schemas/VirtualInterfaceTestHistory'
    OwnerAccount:
      type: string
    TestId:
      type: string
    TestDuration:
      type: integer
    MaxResultSetSize:
      type: integer
    DirectConnectClientException: {}
    StartTime:
      type: string
      format: date-time
    BGPPeerIdList:
      type: array
      items:
        $ref: '#/components/schemas/BGPPeerId'
    ListVirtualInterfaceTestHistoryResponse:
      type: object
      properties:
        virtualInterfaceTestHistory:
          allOf:
          - $ref: '#/components/schemas/VirtualInterfaceTestHistoryList'
          - description: The ID of the tested virtual interface.
        nextToken:
          allOf:
          - $ref: '#/components/schemas/PaginationToken'
          - description: The token to use to retrieve the next page of results. This value is <code>null</code> when there are no more results to return.
  parameters:
