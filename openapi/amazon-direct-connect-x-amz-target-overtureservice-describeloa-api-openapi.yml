security:
- hmac: []
tags:
- name: '#X Amz Target=OvertureService.DescribeLoa'
paths:
  /#X-Amz-Target=OvertureService.DescribeLoa:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: DescribeLoa
      description: <p>Gets the LOA-CFA for a connection, interconnect, or link aggregation group (LAG).</p> <p>The Letter of Authorization - Connecting Facility Assignment (LOA-CFA) is a document that is used when establishing your cross connect to Amazon Web Services at the colocation facility. For more information, see <a href="https://docs.aws.amazon.com/directconnect/latest/UserGuide/Colocation.html">Requesting Cross Connects at Direct Connect Locations</a> in the <i>Direct Connect User Guide</i>.</p>
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Loa'
        '480':
          description: DirectConnectServerException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectConnectServerException'
        '481':
          description: DirectConnectClientException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectConnectClientException'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DescribeLoaRequest'
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - OvertureService.DescribeLoa
      tags:
      - '#X Amz Target=OvertureService.DescribeLoa'
components:
  parameters:
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
  schemas:
    LoaContentType:
      type: string
      enum:
      - application/pdf
    DirectConnectClientException: {}
    ConnectionId:
      type: string
    DirectConnectServerException: {}
    Loa:
      type: object
      properties:
        loaContent:
          allOf:
          - $ref: '#/components/schemas/LoaContent'
          - description: The binary contents of the LOA-CFA document.
        loaContentType:
          allOf:
          - $ref: '#/components/schemas/LoaContentType'
          - description: The standard media type for the LOA-CFA document. The only supported value is application/pdf.
      description: Information about a Letter of Authorization - Connecting Facility Assignment (LOA-CFA) for a connection.
    DescribeLoaRequest:
      type: object
      required:
      - connectionId
      title: DescribeLoaRequest
      properties:
        connectionId:
          allOf:
          - $ref: '#/components/schemas/ConnectionId'
          - description: The ID of a connection, LAG, or interconnect.
        providerName:
          allOf:
          - $ref: '#/components/schemas/ProviderName'
          - description: The name of the service provider who establishes connectivity on your behalf. If you specify this parameter, the LOA-CFA lists the provider name alongside your company name as the requester of the cross connect.
        loaContentType:
          allOf:
          - $ref: '#/components/schemas/LoaContentType'
          - description: The standard media type for the LOA-CFA document. The only supported value is application/pdf.
    LoaContent:
      type: string
    ProviderName:
      type: string
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
