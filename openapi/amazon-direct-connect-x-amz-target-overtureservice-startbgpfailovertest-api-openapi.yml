security:
- hmac: []
tags:
- name: '#X Amz Target=OvertureService.StartBgpFailoverTest'
paths:
  /#X-Amz-Target=OvertureService.StartBgpFailoverTest:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: StartBgpFailoverTest
      description: 'Starts the virtual interface failover test that verifies your configuration meets your resiliency requirements by placing the BGP peering session in the DOWN state. You can then send traffic to verify that there are no outages.


        You can run the test on public, private, transit, and hosted virtual interfaces.


        You can use ListVirtualInterfaceTestHistory to view the virtual interface test history.


        If you need to stop the test before the test interval completes, use StopBgpFailoverTest.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartBgpFailoverTestResponse'
        '480':
          description: DirectConnectServerException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectConnectServerException'
        '481':
          description: DirectConnectClientException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectConnectClientException'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartBgpFailoverTestRequest'
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - OvertureService.StartBgpFailoverTest
      tags:
      - '#X Amz Target=OvertureService.StartBgpFailoverTest'
      summary: Start bgp failover test
      x-summary-source: derived
components:
  parameters:
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
  schemas:
    VirtualInterfaceId:
      type: string
    TestId:
      type: string
    DirectConnectClientException: {}
    DirectConnectServerException: {}
    StartTime:
      type: string
      format: date-time
    EndTime:
      type: string
      format: date-time
    OwnerAccount:
      type: string
    VirtualInterfaceTestHistory:
      type: object
      properties:
        testId:
          allOf:
          - $ref: '#/components/schemas/TestId'
          - description: The ID of the virtual interface failover test.
        virtualInterfaceId:
          allOf:
          - $ref: '#/components/schemas/VirtualInterfaceId'
          - description: The ID of the tested virtual interface.
        bgpPeers:
          allOf:
          - $ref: '#/components/schemas/BGPPeerIdList'
          - description: The BGP peers that were put in the DOWN state as part of the virtual interface failover test.
        status:
          allOf:
          - $ref: '#/components/schemas/FailureTestHistoryStatus'
          - description: The status of the virtual interface failover test.
        ownerAccount:
          allOf:
          - $ref: '#/components/schemas/OwnerAccount'
          - description: The owner ID of the tested virtual interface.
        testDurationInMinutes:
          allOf:
          - $ref: '#/components/schemas/TestDuration'
          - description: The time that the virtual interface failover test ran in minutes.
        startTime:
          allOf:
          - $ref: '#/components/schemas/StartTime'
          - description: The time that the virtual interface moves to the DOWN state.
        endTime:
          allOf:
          - $ref: '#/components/schemas/EndTime'
          - description: The time that the virtual interface moves out of the DOWN state.
      description: Information about the virtual interface failover test.
    StartBgpFailoverTestRequest:
      type: object
      required:
      - virtualInterfaceId
      title: StartBgpFailoverTestRequest
      properties:
        virtualInterfaceId:
          allOf:
          - $ref: '#/components/schemas/VirtualInterfaceId'
          - description: The ID of the virtual interface you want to test.
        bgpPeers:
          allOf:
          - $ref: '#/components/schemas/BGPPeerIdList'
          - description: The BGP peers to place in the DOWN state.
        testDurationInMinutes:
          allOf:
          - $ref: '#/components/schemas/TestDuration'
          - description: '<p>The time in minutes that the virtual interface failover test will last.</p> <p>Maximum value: 4,320 minutes (72 hours).</p> <p>Default: 180 minutes (3 hours).</p>'
    FailureTestHistoryStatus:
      type: string
    TestDuration:
      type: integer
    StartBgpFailoverTestResponse:
      type: object
      properties:
        virtualInterfaceTest:
          allOf:
          - $ref: '#/components/schemas/VirtualInterfaceTestHistory'
          - description: Information about the virtual interface failover test.
    BGPPeerIdList:
      type: array
      items:
        $ref: '#/components/schemas/BGPPeerId'
    BGPPeerId:
      type: string
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
