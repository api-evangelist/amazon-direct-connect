security:
- hmac: []
tags:
- name: '#X Amz Target=OvertureService.AssociateMacSecKey'
paths:
  /#X-Amz-Target=OvertureService.AssociateMacSecKey:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: AssociateMacSecKey
      description: <p>Associates a MAC Security (MACsec) Connection Key Name (CKN)/ Connectivity Association Key (CAK) pair with an Direct Connect dedicated connection.</p> <p>You must supply either the <code>secretARN,</code> or the CKN/CAK (<code>ckn</code> and <code>cak</code>) pair in the request.</p> <p>For information about MAC Security (MACsec) key considerations, see <a href="https://docs.aws.amazon.com/directconnect/latest/UserGuide/direct-connect-mac-sec-getting-started.html#mac-sec-key-consideration">MACsec pre-shared CKN/CAK key considerations </a> in the <i>Direct Connect User Guide</i>.</p>
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssociateMacSecKeyResponse'
        '480':
          description: DirectConnectServerException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectConnectServerException'
        '481':
          description: DirectConnectClientException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectConnectClientException'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssociateMacSecKeyRequest'
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - OvertureService.AssociateMacSecKey
      tags:
      - '#X Amz Target=OvertureService.AssociateMacSecKey'
components:
  schemas:
    MacSecKeyList:
      type: array
      items:
        $ref: '#/components/schemas/MacSecKey'
    AssociateMacSecKeyRequest:
      type: object
      required:
      - connectionId
      title: AssociateMacSecKeyRequest
      properties:
        connectionId:
          allOf:
          - $ref: '#/components/schemas/ConnectionId'
          - description: <p>The ID of the dedicated connection (dxcon-xxxx), or the ID of the LAG (dxlag-xxxx).</p> <p>You can use <a>DescribeConnections</a> or <a>DescribeLags</a> to retrieve connection ID.</p>
        secretARN:
          allOf:
          - $ref: '#/components/schemas/SecretARN'
          - description: <p>The Amazon Resource Name (ARN) of the MAC Security (MACsec) secret key to associate with the dedicated connection.</p> <p>You can use <a>DescribeConnections</a> or <a>DescribeLags</a> to retrieve the MAC Security (MACsec) secret key.</p> <p>If you use this request parameter, you do not use the <code>ckn</code> and <code>cak</code> request parameters.</p>
        ckn:
          allOf:
          - $ref: '#/components/schemas/Ckn'
          - description: <p>The MAC Security (MACsec) CKN to associate with the dedicated connection.</p> <p>You can create the CKN/CAK pair using an industry standard tool.</p> <p> The valid values are 64 hexadecimal characters (0-9, A-E).</p> <p>If you use this request parameter, you must use the <code>cak</code> request parameter and not use the <code>secretARN</code> request parameter.</p>
        cak:
          allOf:
          - $ref: '#/components/schemas/Cak'
          - description: <p>The MAC Security (MACsec) CAK to associate with the dedicated connection.</p> <p>You can create the CKN/CAK pair using an industry standard tool.</p> <p> The valid values are 64 hexadecimal characters (0-9, A-E).</p> <p>If you use this request parameter, you must use the <code>ckn</code> request parameter and not use the <code>secretARN</code> request parameter.</p>
    DirectConnectClientException: {}
    DirectConnectServerException: {}
    AssociateMacSecKeyResponse:
      type: object
      properties:
        connectionId:
          allOf:
          - $ref: '#/components/schemas/ConnectionId'
          - description: The ID of the dedicated connection (dxcon-xxxx), or the ID of the LAG (dxlag-xxxx).
        macSecKeys:
          allOf:
          - $ref: '#/components/schemas/MacSecKeyList'
          - description: The MAC Security (MACsec) security keys associated with the dedicated connection.
    State:
      type: string
    ConnectionId:
      type: string
    SecretARN:
      type: string
    Cak:
      type: string
    Ckn:
      type: string
    StartOnDate:
      type: string
    MacSecKey:
      type: object
      properties:
        secretARN:
          allOf:
          - $ref: '#/components/schemas/SecretARN'
          - description: The Amazon Resource Name (ARN) of the MAC Security (MACsec) secret key.
        ckn:
          allOf:
          - $ref: '#/components/schemas/Ckn'
          - description: The Connection Key Name (CKN) for the MAC Security secret key.
        state:
          allOf:
          - $ref: '#/components/schemas/State'
          - description: '<p>The state of the MAC Security (MACsec) secret key.</p> <p>The possible values are:</p> <ul> <li> <p> <code>associating</code>: The MAC Security (MACsec) secret key is being validated and not yet associated with the connection or LAG.</p> </li> <li> <p> <code>associated</code>: The MAC Security (MACsec) secret key is validated and associated with the connection or LAG.</p> </li> <li> <p> <code>disassociating</code>: The MAC Security (MACsec) secret key is being disassociated from the connection or LAG</p> </li> <li> <p> <code>disassociated</code>: The MAC Security (MACsec) secret key is no longer associated with the connection or LAG.</p> </li> </ul>'
        startOn:
          allOf:
          - $ref: '#/components/schemas/StartOnDate'
          - description: The date that the MAC Security (MACsec) secret key takes effect. The value is displayed in UTC format.
      description: Information about the MAC Security (MACsec) secret key.
  parameters:
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
