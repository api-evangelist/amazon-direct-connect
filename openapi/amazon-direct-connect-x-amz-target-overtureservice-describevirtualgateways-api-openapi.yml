tags:
- name: '#X Amz Target=OvertureService.DescribeVirtualGateways'
paths:
  /#X-Amz-Target=OvertureService.DescribeVirtualGateways:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: DescribeVirtualGateways
      description: 'Lists the virtual private gateways owned by the Amazon Web Services account.


        You can create one or more Direct Connect private virtual interfaces linked to a virtual private gateway.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualGateways'
        '480':
          description: DirectConnectServerException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectConnectServerException'
        '481':
          description: DirectConnectClientException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectConnectClientException'
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - OvertureService.DescribeVirtualGateways
      tags:
      - '#X Amz Target=OvertureService.DescribeVirtualGateways'
      summary: Describe virtual gateways
      x-summary-source: derived
components:
  parameters:
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
  schemas:
    VirtualGateways:
      type: object
      properties:
        virtualGateways:
          allOf:
          - $ref: '#/components/schemas/VirtualGatewayList'
          - description: The virtual private gateways.
    VirtualGatewayState:
      type: string
    VirtualGatewayList:
      type: array
      items:
        $ref: '#/components/schemas/VirtualGateway'
    DirectConnectClientException: {}
    DirectConnectServerException: {}
    VirtualGateway:
      type: object
      properties:
        virtualGatewayId:
          allOf:
          - $ref: '#/components/schemas/VirtualGatewayId'
          - description: The ID of the virtual private gateway.
        virtualGatewayState:
          allOf:
          - $ref: '#/components/schemas/VirtualGatewayState'
          - description: '<p>The state of the virtual private gateway. The following are the possible values:</p> <ul> <li> <p> <code>pending</code>: Initial state after creating the virtual private gateway.</p> </li> <li> <p> <code>available</code>: Ready for use by a private virtual interface.</p> </li> <li> <p> <code>deleting</code>: Initial state after deleting the virtual private gateway.</p> </li> <li> <p> <code>deleted</code>: The virtual private gateway is deleted. The private virtual interface is unable to send traffic over this gateway.</p> </li> </ul>'
      description: Information about a virtual private gateway for a private virtual interface.
    VirtualGatewayId:
      type: string
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
