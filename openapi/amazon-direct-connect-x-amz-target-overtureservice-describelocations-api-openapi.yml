tags:
- name: '#X Amz Target=OvertureService.DescribeLocations'
paths:
  /#X-Amz-Target=OvertureService.DescribeLocations:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: DescribeLocations
      description: Lists the Direct Connect locations in the current Amazon Web Services Region. These are the locations that can be selected when calling <a>CreateConnection</a> or <a>CreateInterconnect</a>.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Locations'
        '480':
          description: DirectConnectServerException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectConnectServerException'
        '481':
          description: DirectConnectClientException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectConnectClientException'
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - OvertureService.DescribeLocations
      tags:
      - '#X Amz Target=OvertureService.DescribeLocations'
components:
  schemas:
    DirectConnectServerException: {}
    AvailablePortSpeeds:
      type: array
      items:
        $ref: '#/components/schemas/PortSpeed'
    LocationList:
      type: array
      items:
        $ref: '#/components/schemas/Location'
    Locations:
      type: object
      properties:
        locations:
          allOf:
          - $ref: '#/components/schemas/LocationList'
          - description: The locations.
    PortSpeed:
      type: string
    Location:
      type: object
      properties:
        locationCode:
          allOf:
          - $ref: '#/components/schemas/LocationCode'
          - description: The code for the location.
        locationName:
          allOf:
          - $ref: '#/components/schemas/LocationName'
          - description: The name of the location. This includes the name of the colocation partner and the physical site of the building.
        region:
          allOf:
          - $ref: '#/components/schemas/Region'
          - description: The Amazon Web Services Region for the location.
        availablePortSpeeds:
          allOf:
          - $ref: '#/components/schemas/AvailablePortSpeeds'
          - description: The available port speeds for the location.
        availableProviders:
          allOf:
          - $ref: '#/components/schemas/ProviderList'
          - description: The name of the service provider for the location.
        availableMacSecPortSpeeds:
          allOf:
          - $ref: '#/components/schemas/AvailableMacSecPortSpeeds'
          - description: The available MAC Security (MACsec) port speeds for the location.
      description: Information about an Direct Connect location.
    LocationName:
      type: string
    ProviderList:
      type: array
      items:
        $ref: '#/components/schemas/ProviderName'
    LocationCode:
      type: string
    ProviderName:
      type: string
    AvailableMacSecPortSpeeds:
      type: array
      items:
        $ref: '#/components/schemas/PortSpeed'
    Region:
      type: string
    DirectConnectClientException: {}
