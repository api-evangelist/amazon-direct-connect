security:
- hmac: []
tags:
- name: '#X Amz Target=OvertureService.DescribeTags'
paths:
  /#X-Amz-Target=OvertureService.DescribeTags:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: DescribeTags
      description: Describes the tags associated with the specified Direct Connect resources.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DescribeTagsResponse'
        '480':
          description: DirectConnectServerException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectConnectServerException'
        '481':
          description: DirectConnectClientException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectConnectClientException'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DescribeTagsRequest'
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - OvertureService.DescribeTags
      tags:
      - '#X Amz Target=OvertureService.DescribeTags'
components:
  schemas:
    DescribeTagsResponse:
      type: object
      properties:
        resourceTags:
          allOf:
          - $ref: '#/components/schemas/ResourceTagList'
          - description: Information about the tags.
    ResourceArn:
      type: string
    ResourceArnList:
      type: array
      items:
        $ref: '#/components/schemas/ResourceArn'
    DirectConnectClientException: {}
    ResourceTagList:
      type: array
      items:
        $ref: '#/components/schemas/ResourceTag'
    Tag:
      type: object
      required:
      - key
      properties:
        key:
          allOf:
          - $ref: '#/components/schemas/TagKey'
          - description: The key.
        value:
          allOf:
          - $ref: '#/components/schemas/TagValue'
          - description: The value.
      description: Information about a tag.
    DirectConnectServerException: {}
    TagKey:
      type: string
      pattern: ^([\p{L}\p{Z}\p{N}_.:/=+\-@]*)$
      minLength: 1
      maxLength: 128
    TagList:
      type: array
      items:
        $ref: '#/components/schemas/Tag'
      minItems: 1
    DescribeTagsRequest:
      type: object
      required:
      - resourceArns
      title: DescribeTagsRequest
      properties:
        resourceArns:
          allOf:
          - $ref: '#/components/schemas/ResourceArnList'
          - description: The Amazon Resource Names (ARNs) of the resources.
    ResourceTag:
      type: object
      properties:
        resourceArn:
          allOf:
          - $ref: '#/components/schemas/ResourceArn'
          - description: The Amazon Resource Name (ARN) of the resource.
        tags:
          allOf:
          - $ref: '#/components/schemas/TagList'
          - description: The tags.
      description: Information about a tag associated with an Direct Connect resource.
    TagValue:
      type: string
      pattern: ^([\p{L}\p{Z}\p{N}_.:/=+\-@]*)$
      minLength: 0
      maxLength: 256
  parameters:
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
