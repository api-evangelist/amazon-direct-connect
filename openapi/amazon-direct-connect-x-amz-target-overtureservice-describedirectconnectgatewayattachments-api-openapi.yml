security:
- hmac: []
tags:
- name: '#X Amz Target=OvertureService.DescribeDirectConnectGatewayAttachments'
paths:
  /#X-Amz-Target=OvertureService.DescribeDirectConnectGatewayAttachments:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: DescribeDirectConnectGatewayAttachments
      description: Lists the attachments between your Direct Connect gateways and virtual interfaces. You must specify a Direct Connect gateway, a virtual interface, or both. If you specify a Direct Connect gateway, the response contains all virtual interfaces attached to the Direct Connect gateway. If you specify a virtual interface, the response contains all Direct Connect gateways attached to the virtual interface. If you specify both, the response contains the attachment between the Direct Connect gateway and the virtual interface.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DescribeDirectConnectGatewayAttachmentsResult'
        '480':
          description: DirectConnectServerException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectConnectServerException'
        '481':
          description: DirectConnectClientException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectConnectClientException'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DescribeDirectConnectGatewayAttachmentsRequest'
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - OvertureService.DescribeDirectConnectGatewayAttachments
      tags:
      - '#X Amz Target=OvertureService.DescribeDirectConnectGatewayAttachments'
components:
  schemas:
    DirectConnectGatewayAttachment:
      type: object
      properties:
        directConnectGatewayId:
          allOf:
          - $ref: '#/components/schemas/DirectConnectGatewayId'
          - description: The ID of the Direct Connect gateway.
        virtualInterfaceId:
          allOf:
          - $ref: '#/components/schemas/VirtualInterfaceId'
          - description: The ID of the virtual interface.
        virtualInterfaceRegion:
          allOf:
          - $ref: '#/components/schemas/VirtualInterfaceRegion'
          - description: The Amazon Web Services Region where the virtual interface is located.
        virtualInterfaceOwnerAccount:
          allOf:
          - $ref: '#/components/schemas/OwnerAccount'
          - description: The ID of the Amazon Web Services account that owns the virtual interface.
        attachmentState:
          allOf:
          - $ref: '#/components/schemas/DirectConnectGatewayAttachmentState'
          - description: '<p>The state of the attachment. The following are the possible values:</p> <ul> <li> <p> <code>attaching</code>: The initial state after a virtual interface is created using the Direct Connect gateway.</p> </li> <li> <p> <code>attached</code>: The Direct Connect gateway and virtual interface are attached and ready to pass traffic.</p> </li> <li> <p> <code>detaching</code>: The initial state after calling <a>DeleteVirtualInterface</a>.</p> </li> <li> <p> <code>detached</code>: The virtual interface is detached from the Direct Connect gateway. Traffic flow between the Direct Connect gateway and virtual interface is stopped.</p> </li> </ul>'
        attachmentType:
          allOf:
          - $ref: '#/components/schemas/DirectConnectGatewayAttachmentType'
          - description: The type of attachment.
        stateChangeError:
          allOf:
          - $ref: '#/components/schemas/StateChangeError'
          - description: The error message if the state of an object failed to advance.
      description: Information about an attachment between a Direct Connect gateway and a virtual interface.
    VirtualInterfaceId:
      type: string
    PaginationToken:
      type: string
    DirectConnectGatewayAttachmentType:
      type: string
      enum:
      - TransitVirtualInterface
      - PrivateVirtualInterface
    DirectConnectClientException: {}
    DirectConnectServerException: {}
    DirectConnectGatewayId:
      type: string
    StateChangeError:
      type: string
    MaxResultSetSize:
      type: integer
    DirectConnectGatewayAttachmentList:
      type: array
      items:
        $ref: '#/components/schemas/DirectConnectGatewayAttachment'
    DescribeDirectConnectGatewayAttachmentsResult:
      type: object
      properties:
        directConnectGatewayAttachments:
          allOf:
          - $ref: '#/components/schemas/DirectConnectGatewayAttachmentList'
          - description: The attachments.
        nextToken:
          allOf:
          - $ref: '#/components/schemas/PaginationToken'
          - description: The token to retrieve the next page.
    VirtualInterfaceRegion:
      type: string
    DescribeDirectConnectGatewayAttachmentsRequest:
      type: object
      title: DescribeDirectConnectGatewayAttachmentsRequest
      properties:
        directConnectGatewayId:
          allOf:
          - $ref: '#/components/schemas/DirectConnectGatewayId'
          - description: The ID of the Direct Connect gateway.
        virtualInterfaceId:
          allOf:
          - $ref: '#/components/schemas/VirtualInterfaceId'
          - description: The ID of the virtual interface.
        maxResults:
          allOf:
          - $ref: '#/components/schemas/MaxResultSetSize'
          - description: <p>The maximum number of results to return with a single call. To retrieve the remaining results, make another call with the returned <code>nextToken</code> value.</p> <p>If <code>MaxResults</code> is given a value larger than 100, only 100 results are returned.</p>
        nextToken:
          allOf:
          - $ref: '#/components/schemas/PaginationToken'
          - description: The token provided in the previous call to retrieve the next page.
    DirectConnectGatewayAttachmentState:
      type: string
      enum:
      - attaching
      - attached
      - detaching
      - detached
    OwnerAccount:
      type: string
  parameters:
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
